<app-header [currentMode]="currentMode" />

<main>
  <section>
    <app-chat-header
      [currentModel]="currentModel()"
      [modelLoading]="modelLoading()"
      [modelLoadingText]="modelLoadingText()"
      [modelLoadError]="modelLoadError()"
      [currentMode]="currentMode"
      [webLLMModelType]="webLLMModelType()"
      [webLLMTextModel]="webLLMTextModel()"
      [disableModelSwitch]="disableModelSwitch()"
      (modelTypeChange)="switchWebLLMModelType($event)"
      (textModelChange)="switchWebLLMTextModel($event)"
    />

    @for (message of messages(); track $index) {
      <app-message-bubble
        [message]="message.content"
        [role]="message.role"
        [type]="message.type"
        [imageUrl]="message.role === 'user' ? message.imageUrl : undefined"
      />
    }

    @if (shouldShowThinkingBubble()) {
      @defer (on timer(500ms)) {
        <app-message-bubble message="Thinking..." role="assistant" type="thinking" />
      }
    }
  </section>

  <app-chat-input
    [isDisabled]="!isAiReady() || isAiReplying()"
    [supportsImages]="supportsVision()"
    (send)="sendMessage($event)"
  />
</main>

<app-footer />
